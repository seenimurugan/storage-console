# Storage Console — k8s manifests
# Namespace: ${HOMELAB_NAMESPACE}
# Access: https://tier.stoat-perch.ts.net
#
# Apply via deploy.sh (which runs envsubst first):
#   envsubst < k8s/storage-console.yaml | kubectl apply -f -
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
---
# Role grants the minimum permissions needed to trigger and observe Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
rules:
  # Trigger jobs from cronjobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  # Watch job pods and stream logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Validate that the target CronJob exists before spawning a Job
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: storage-console
    namespace: ${HOMELAB_NAMESPACE}
roleRef:
  kind: Role
  name: storage-console
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-console
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: storage-console
    spec:
      serviceAccountName: storage-console
      containers:
        - name: storage-console
          image: ${STORAGE_CONSOLE_IMAGE}:${STORAGE_CONSOLE_TAG}
          imagePullPolicy: Never  # local image (OrbStack k3s shares Mac docker images)
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: NAMESPACE
              value: "${HOMELAB_NAMESPACE}"
          readinessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: storage-console
  ports:
    - port: 8080
      targetPort: http
      name: http
---
# Tailscale ingress — creates a Tailscale node at tier.stoat-perch.ts.net
# (host field becomes the Tailscale machine name; TLS is automatic)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-console
  namespace: ${HOMELAB_NAMESPACE}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: storage-console
      port:
        number: 8080
  tls:
    - hosts:
        - tier
