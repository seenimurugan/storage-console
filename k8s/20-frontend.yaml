# Storage Console frontend (Next.js standalone)
# Note: this file is processed by envsubst in deploy.sh.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-console-frontend
  namespace: ${HOMELAB_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-console-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: storage-console-frontend
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}:${FRONTEND_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-console-frontend
  namespace: ${HOMELAB_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: storage-console-frontend
  ports:
    - port: 80
      targetPort: http
      name: http
