# ─────────────────────────────────────────────────────────────────────────────
# 70-secrets-backup.yaml — RBAC + RBAC for the secrets-backup one-off Job.
#
# Design principles (from spec):
#   • DEDICATED ServiceAccount (secrets-backup) with cluster-wide get/list on
#     secrets so it can dump secrets across homelab/monitoring/kube-system etc.
#   • The storage-console backend SA does NOT get broad secret-read privilege.
#     It only needs RBAC to create/get one-off Jobs + read their pods/logs
#     (already covered by the existing Role in 10-backend.yaml).
#   • age recipient public key shipped as a ConfigMap — it is a PUBLIC key,
#     never the private key.
#
# Note: this file uses ${HOMELAB_NAMESPACE} — processed by envsubst in deploy.sh.
# For a manual one-off apply:
#   HOMELAB_NAMESPACE=homelab envsubst < k8s/70-secrets-backup.yaml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────────────────
---
# ServiceAccount used by the one-off secrets-backup Job pods.
# Kept SEPARATE from the storage-console backend SA — the broad secret-read
# privilege must not bleed into the backend.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-backup
  namespace: ${HOMELAB_NAMESPACE}
---
# ClusterRole: get/list secrets across ALL namespaces.
# Scoped to secrets only — minimum required for the dump.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-backup-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-backup-reader
subjects:
  - kind: ServiceAccount
    name: secrets-backup
    namespace: ${HOMELAB_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-backup-reader
---
# ConfigMap: age recipient public key (encrypt-only — private key is offline).
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-backup-config
  namespace: ${HOMELAB_NAMESPACE}
data:
  # Age recipient public key for DR encryption.
  # The matching PRIVATE key lives offline (~/homelab-secrets-age-key.txt).
  # NEVER put the private key here.
  AGE_RECIPIENT: "age1u79eew0x7dm8s6pnk7yvpzg2m0q3mgmrf72cn0wmm55fv5zu2gqs29y59m"
