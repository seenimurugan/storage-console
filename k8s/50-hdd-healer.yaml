# HDD Auto-Healer CronJob — virtiofs stale-bind self-correction
#
# Problem: OrbStack k3s shares /Volumes/homelab-hdd into pods via virtiofs
# (hostPath). When the HDD is unplugged and replugged on the Mac host,
# already-running pods keep a stale virtiofs bind: /proc/mounts still shows
# the mount, but any read returns ENOENT. Thumbnails (SSD) work; tiered
# originals (HDD) don't play. A fresh pod gets a clean bind and reads fine.
# Fix: kubectl rollout restart — the new pod picks up the live virtiofs mount.
#
# Detection (two-stage, no false positives):
#   1. Host-HDD probe: healer pod mounts the same hostPath fresh.
#      If IT cannot read → HDD genuinely absent on host → skip (no point).
#   2. Per-deployment staleness: exec into the running pod and test its HDD
#      mountpath. If fresh mount readable but running pod not → stale → restart.
#
# Anti-thrash: skip restart if deployment's restartedAt annotation is <10min old.
#
# Targets:
#   - immich-server  container=main  in-pod=/data-hdd  probe=/data-hdd/library
#   - jellyfin       container=jellyfin  in-pod=/media-hdd  probe=/media-hdd/tamil
#
# Note: the image tag IS substituted by envsubst (${HDD_HEALER_TAG}); all other
# values are literal. The namespace is hardcoded to homelab.
# IMPORTANT: when bumping the healer image you MUST also bump HDD_HEALER_TAG in
# .env / .env.example AND rebuild with both tags (hdd-healer:<ver> + hdd-healer:latest).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hdd-healer
  namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hdd-healer
  namespace: homelab
rules:
  # List pods to find the running pod for each deployment
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # exec into running pods to probe the HDD mount
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # read + patch deployments for rollout restart (patch spec.template.metadata.annotations)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hdd-healer
  namespace: homelab
subjects:
  - kind: ServiceAccount
    name: hdd-healer
    namespace: homelab
roleRef:
  kind: Role
  name: hdd-healer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hdd-healer-script
  namespace: homelab
data:
  heal.sh: |
    #!/bin/sh
    # heal.sh — virtiofs stale-bind healer
    # Runs inside a fresh pod (clean virtiofs bind).
    # Uses kubectl exec to probe running app pods.
    set -eu

    NS="homelab"
    COOLDOWN_MINUTES=10
    # Probe path on the FRESH mount (healer pod itself)
    # /hdd-root is the hostPath mount of /Volumes/homelab-hdd
    HOST_PROBE_DIR="/hdd-root/immich-library"

    ts() { date +%Y-%m-%dT%H:%M:%S%z; }
    log() { echo "ts=$(ts) $*"; }

    log "event=healer.start outcome=begin reason=cronjob-triggered"

    # ── Stage 1: Host-HDD presence probe ──────────────────────────────────────
    # If the healer pod's own fresh mount can't read the expected subdir,
    # the HDD is genuinely absent on the host. Restarting pods would be
    # pointless (new pod would also get an empty/unmounted path). Skip all.
    if ls "${HOST_PROBE_DIR}" >/dev/null 2>&1; then
      log "event=healer.host_probe outcome=pass reason=hdd-readable-via-fresh-mount probe=${HOST_PROBE_DIR}"
    else
      log "event=healer.host_probe outcome=absent reason=hdd-not-readable-via-fresh-mount probe=${HOST_PROBE_DIR}"
      log "event=healer.end outcome=skip reason=hdd-absent-on-host-no-action-taken"
      exit 0
    fi

    # Helper: parse ISO8601 timestamp to epoch seconds (POSIX sh + busybox date)
    # kubectl annotates with RFC3339 e.g. "2026-06-04T18:08:55+01:00"
    # Alpine busybox date -D accepts strptime format; strip timezone offset
    # and treat as UTC-equivalent for cooldown purposes (small error is fine).
    parse_epoch() {
      local raw="$1"
      # Strip sub-second and timezone suffix, keep "2026-06-04T18:08:55"
      local stripped
      stripped=$(echo "${raw}" | sed 's/\.[0-9]*//' | sed 's/[+-][0-9][0-9]:[0-9][0-9]$//' | sed 's/Z$//')
      # busybox date -D '%Y-%m-%dT%H:%M:%S' -d <value> +%s
      date -D '%Y-%m-%dT%H:%M:%S' -d "${stripped}" +%s 2>/dev/null || echo 0
    }

    # Helper: check if a deployment was restarted recently (cooldown guard)
    # Returns 0 if within cooldown (should skip), 1 if safe to restart.
    within_cooldown() {
      local deploy="$1"
      local restarted_at
      restarted_at=$(kubectl get deploy "${deploy}" -n "${NS}" \
        -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
      if [ -z "${restarted_at}" ]; then
        # Never restarted — safe to proceed
        log "event=healer.cooldown_check deploy=${deploy} outcome=clear reason=never-restarted"
        return 1
      fi
      local restarted_epoch
      restarted_epoch=$(parse_epoch "${restarted_at}")
      if [ "${restarted_epoch}" = "0" ]; then
        log "event=healer.cooldown_check deploy=${deploy} outcome=parse-failed reason=timestamp-unparseable ts=${restarted_at} action=proceeding-safe"
        return 1
      fi
      local now_epoch
      now_epoch=$(date +%s)
      local age_minutes=$(( (now_epoch - restarted_epoch) / 60 ))
      if [ "${age_minutes}" -lt "${COOLDOWN_MINUTES}" ]; then
        log "event=healer.cooldown_check deploy=${deploy} outcome=in-cooldown reason=last-restart-${age_minutes}min-ago threshold=${COOLDOWN_MINUTES}min"
        return 0
      fi
      log "event=healer.cooldown_check deploy=${deploy} outcome=clear reason=last-restart-${age_minutes}min-ago threshold=${COOLDOWN_MINUTES}min"
      return 1
    }

    # Helper: probe a running pod's HDD mount via kubectl exec
    # Returns 0 if healthy (readable), 1 if stale, 2 if no running pod found, 3 if exec-error
    # $4 = label selector (e.g. "app.kubernetes.io/name=server,app.kubernetes.io/instance=immich")
    #
    # Sentinel-based disambiguation:
    #   PROBE_OK   — exec reached the pod AND ls of probe_path succeeded  → healthy
    #   PROBE_FAIL — exec reached the pod AND ls of probe_path failed     → stale, restart
    #   (neither)  — kubectl exec itself failed (RBAC, Terminating, API)  → exec-error, skip restart
    # Branching on captured stdout (not kubectl exit code) avoids false-positive
    # restarts when the pod is unreachable for reasons unrelated to the HDD.
    probe_pod() {
      local deploy="$1"
      local container="$2"
      local probe_path="$3"
      local label_selector="$4"

      local pod
      pod=$(kubectl get pods -n "${NS}" -l "${label_selector}" \
        --field-selector=status.phase=Running \
        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

      if [ -z "${pod}" ]; then
        log "event=healer.pod_probe deploy=${deploy} selector=${label_selector} outcome=no-pod reason=no-running-pod-found"
        return 2
      fi

      log "event=healer.pod_probe deploy=${deploy} pod=${pod} container=${container} probe=${probe_path} outcome=begin"

      # Emit a sentinel from inside the pod so we can distinguish exec-itself-failing
      # (network/RBAC/Terminating) from the HDD path being unreadable (stale mount).
      local sentinel
      sentinel=$(kubectl exec "${pod}" -n "${NS}" -c "${container}" \
        -- sh -c "if ls '${probe_path}' >/dev/null 2>&1; then echo PROBE_OK; else echo PROBE_FAIL; fi" \
        2>/dev/null || true)

      case "${sentinel}" in
        PROBE_OK)
          log "event=healer.pod_probe deploy=${deploy} pod=${pod} outcome=healthy reason=hdd-path-readable sentinel=PROBE_OK"
          return 0
          ;;
        PROBE_FAIL)
          log "event=healer.pod_probe deploy=${deploy} pod=${pod} outcome=stale reason=hdd-path-unreadable-stale-virtiofs-bind sentinel=PROBE_FAIL"
          return 1
          ;;
        *)
          # kubectl exec failed before reaching the container (RBAC, pod Terminating,
          # transient API error, etc.). Sentinel is empty or unexpected.
          # Do NOT restart — the probe is inconclusive.
          log "event=healer.pod_probe deploy=${deploy} pod=${pod} outcome=exec-error reason=kubectl-exec-did-not-produce-sentinel sentinel='${sentinel}' action=skip-restart"
          return 3
          ;;
      esac
    }

    # Helper: trigger rollout restart via annotation patch
    restart_deploy() {
      local deploy="$1"
      local reason="$2"
      local now_ts
      now_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      log "event=healer.restart deploy=${deploy} outcome=begin reason=${reason} restart_ts=${now_ts}"
      if kubectl patch deployment "${deploy}" -n "${NS}" \
          --type=merge \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"${now_ts}\"}}}}}" 2>/dev/null; then
        log "event=healer.restart deploy=${deploy} outcome=success reason=rollout-restart-patch-applied ts=${now_ts}"
      else
        log "event=healer.restart deploy=${deploy} outcome=fail reason=kubectl-patch-returned-error"
      fi
    }

    # ── Stage 2: Per-deployment staleness check ────────────────────────────────
    # Format: "deploy_name|container_name|in_pod_probe_path|pod_label_selector"
    # Label selectors verified from: kubectl get deploy <name> -o jsonpath='{.spec.selector.matchLabels}'
    # immich-server: app.kubernetes.io/controller=main,app.kubernetes.io/instance=immich,app.kubernetes.io/name=server
    # jellyfin:      app.kubernetes.io/instance=jellyfin,app.kubernetes.io/name=jellyfin
    TARGETS="
    immich-server|main|/data-hdd/library|app.kubernetes.io/controller=main,app.kubernetes.io/instance=immich,app.kubernetes.io/name=server
    jellyfin|jellyfin|/media-hdd/tamil|app.kubernetes.io/instance=jellyfin,app.kubernetes.io/name=jellyfin
    "

    for target in ${TARGETS}; do
      # skip blank lines from the heredoc formatting
      [ -z "${target}" ] && continue

      DEPLOY=$(echo "${target}" | cut -d'|' -f1)
      CONTAINER=$(echo "${target}" | cut -d'|' -f2)
      PROBE=$(echo "${target}" | cut -d'|' -f3)
      SELECTOR=$(echo "${target}" | cut -d'|' -f4)

      log "event=healer.check deploy=${DEPLOY} container=${CONTAINER} probe=${PROBE} outcome=begin"

      # Cooldown guard first — avoid restart loops
      if within_cooldown "${DEPLOY}"; then
        log "event=healer.check deploy=${DEPLOY} outcome=skip reason=in-cooldown"
        continue
      fi

      # Probe the running pod
      probe_result=0
      probe_pod "${DEPLOY}" "${CONTAINER}" "${PROBE}" "${SELECTOR}" || probe_result=$?

      case "${probe_result}" in
        0)
          log "event=healer.check deploy=${DEPLOY} outcome=healthy reason=no-action-needed"
          ;;
        1)
          log "event=healer.check deploy=${DEPLOY} outcome=stale reason=fresh-mount-readable-but-pod-cannot-read"
          restart_deploy "${DEPLOY}" "stale-virtiofs-bind"
          ;;
        2)
          log "event=healer.check deploy=${DEPLOY} outcome=skip reason=no-running-pod"
          ;;
        3)
          log "event=healer.check deploy=${DEPLOY} outcome=skip reason=exec-error-probe-inconclusive"
          ;;
        *)
          log "event=healer.check deploy=${DEPLOY} outcome=unknown-probe-result result=${probe_result}"
          ;;
      esac
    done

    log "event=healer.end outcome=success reason=all-targets-checked"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hdd-healer
  namespace: homelab
  labels:
    app: hdd-healer
    component: auto-heal
spec:
  # Default: suspend: true — manual-only via storage-console UI.
  # This prevents the healer from restarting Immich/Jellyfin in an endless loop
  # while the HDD is disconnected. Flip to auto via the UI ONLY when the HDD is
  # consistently present. Any re-apply of this manifest keeps it suspended.
  suspend: true
  # Every minute — fast recovery after HDD replug
  schedule: "* * * * *"
  timeZone: "Europe/London"
  concurrencyPolicy: Forbid
  # 200s gives the scheduler plenty of leeway even if the node is momentarily busy.
  # The old value (30s) caused missed-schedule counts to hit 100 quickly, which
  # permanently disables the CronJob. concurrencyPolicy: Forbid already prevents
  # overlap, so a generous deadline is safe.
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Never retry — a fresh attempt next minute is cleaner than a failed-pod loop
      backoffLimit: 0
      # Kill a hung run before the next minute fires. Without this, a kubectl exec
      # blocking on a wedged pod would starve all future ticks (concurrencyPolicy: Forbid).
      # 50s < 60s schedule interval, so the next tick always gets a clean slot.
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app: hdd-healer
        spec:
          serviceAccountName: hdd-healer
          restartPolicy: Never
          # Run as root so ls on virtiofs HFS+ paths (noowners) works
          securityContext:
            runAsUser: 0
          containers:
            - name: healer
              image: hdd-healer:${HDD_HEALER_TAG}
              imagePullPolicy: Never
              command: ["/bin/sh", "/scripts/heal.sh"]
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              volumeMounts:
                - name: hdd-root
                  mountPath: /hdd-root
                  readOnly: true
                - name: script
                  mountPath: /scripts
          volumes:
            # Fresh hostPath mount of the HDD root — clean virtiofs bind
            # This is how we tell if the HDD is genuinely present on the host
            - name: hdd-root
              hostPath:
                path: /Volumes/homelab-hdd
                type: ""
            - name: script
              configMap:
                name: hdd-healer-script
                defaultMode: 0755
