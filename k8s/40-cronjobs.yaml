# Storage Console — managed CronJobs
#
# These three CronJobs are owned by storage-console (v2 onward).  Previously
# they lived in cluster-setup/50-tiered-storage-mover.yaml + ~/homelab/
# immich-backup-cronjob.yaml — the v2 rewrite moves ownership here because
# the storage-console UI is the canonical surface for managing them.
#
# Compatibility:
#   - CronJob names (tier-mover-immich, tier-mover-jellyfin, immich-backup)
#     are unchanged so ~/homelab/tier-now.sh still works as a manual fallback.
#   - All three default to suspend: true (manual mode); flip to auto via the UI.
#
# HDD guard:
#   Each container's command is wrapped:
#     test -d $HDD_PATH || { echo "HDD not mounted, skipping"; exit 0; }
#   so a scheduled run with an unplugged HDD exits 0 silently rather than
#   filling the failedJobsHistoryLimit with noisy failures.
#
# Note: this file is processed by envsubst in deploy.sh.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiered-storage-mover
  namespace: ${HOMELAB_NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-backup
  namespace: ${HOMELAB_NAMESPACE}
---
# Shared mover script — moves files > threshold from SSD to HDD, replaces
# original with a symlink to the HDD path that's visible inside the consumer
# app pod (Immich = /data-hdd, Jellyfin = /media-hdd).  See ~/homelab/tier-now.sh
# and the original cluster-setup yaml for the full design rationale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tiered-storage-mover-script
  namespace: ${HOMELAB_NAMESPACE}
data:
  mover.sh: |
    #!/bin/sh
    set -eu

    # HDD-mounted guard — the volumeMount source is the host HDD path.  If the
    # disk is unplugged, hostPath silently mounts an empty directory.  We check
    # for at least one expected subdir (immich-library or jellyfin-media).
    if [ ! -d /hdd-check ] || [ -z "$(ls -A /hdd-check 2>/dev/null)" ]; then
      echo "SKIP HDD not mounted (or empty) — exiting 0."
      exit 0
    fi

    if [ -z "${APP:-}" ]; then
      echo "ERROR: APP env var is not set."; exit 1
    fi
    case "$APP" in immich|jellyfin) ;; *) echo "ERROR: APP='${APP}' invalid"; exit 1 ;; esac
    echo "=== Tiered Storage Mover: APP=${APP} ==="

    IMMICH_SSD=/ssd-immich
    IMMICH_HDD=/hdd-immich
    IMMICH_POD_HDD=/data-hdd
    IMMICH_THRESHOLD_BYTES=2147483648   # 2 GiB

    JELLYFIN_SSD=/ssd-jellyfin
    JELLYFIN_HDD=/hdd-jellyfin
    JELLYFIN_POD_HDD=/media-hdd
    JELLYFIN_THRESHOLD_BYTES=3221225472 # 3 GiB

    init_counters() {
      local prefix="$1"
      for c in moved bytes failed skipped; do printf '0' > "/tmp/${prefix}_${c}"; done
    }
    inc_counter() {
      local f="/tmp/${1}_${2}"; local cur
      cur="$(cat "$f")"; printf '%s' "$(( cur + $3 ))" > "$f"
    }
    read_counter() { cat "/tmp/${1}_${2}"; }
    init_counters "$APP"

    move_file() {
      local ssd_file="$1" hdd_dir="$2" pod_hdd_mount="$3" rel_prefix="$4" app="$5"
      local ssd_src
      [ "$app" = "immich" ] && ssd_src="${IMMICH_SSD}" || ssd_src="${JELLYFIN_SSD}"
      local base_dir="${ssd_src}/${rel_prefix}"
      local rel_path="${ssd_file#${base_dir}/}"
      local hdd_dest="${hdd_dir}/${rel_prefix}/${rel_path}"
      local hdd_dest_dir; hdd_dest_dir="$(dirname "$hdd_dest")"
      local pod_target="${pod_hdd_mount}/${rel_prefix}/${rel_path}"
      local tmplink="${ssd_file}.tmplink"
      local file_size; file_size="$(stat -c%s "$ssd_file" 2>/dev/null || echo 0)"

      if [ -L "$ssd_file" ]; then
        echo "SKIP already-symlinked ${ssd_file}"; inc_counter "$app" skipped 1; return 0
      fi
      if [ -f "$hdd_dest" ]; then
        echo "SKIP hdd-already-exists ${ssd_file}"; inc_counter "$app" skipped 1; return 0
      fi
      mkdir -p "$hdd_dest_dir"
      if ! cp -p "$ssd_file" "$hdd_dest"; then
        echo "FAIL cp-error ${ssd_file}"; inc_counter "$app" failed 1; rm -f "$hdd_dest"; return 0
      fi
      local src_hash dst_hash
      src_hash="$(sha256sum "$ssd_file" | awk '{print $1}')"
      dst_hash="$(sha256sum "$hdd_dest" | awk '{print $1}')"
      if [ "$src_hash" != "$dst_hash" ]; then
        echo "FAIL sha256-mismatch ${ssd_file}"; inc_counter "$app" failed 1; rm -f "$hdd_dest"; return 0
      fi
      if ! ln -sf "$pod_target" "$tmplink"; then
        echo "FAIL symlink-create ${ssd_file}"; inc_counter "$app" failed 1; rm -f "$hdd_dest"; return 0
      fi
      if ! mv -f "$tmplink" "$ssd_file"; then
        echo "FAIL atomic-rename ${ssd_file}"; inc_counter "$app" failed 1; rm -f "$tmplink" "$hdd_dest"; return 0
      fi
      echo "MOVED ${ssd_file} size=${file_size} -> ${pod_target}"
      inc_counter "$app" moved 1; inc_counter "$app" bytes "$file_size"
    }

    FILELIST=/tmp/mover_filelist
    if [ "$APP" = "immich" ]; then
      echo "=== Immich: scanning library/ and encoded-video/ ==="
      for subdir in library encoded-video; do
        src_dir="${IMMICH_SSD}/${subdir}"
        if [ ! -d "$src_dir" ]; then echo "SKIP dir-missing ${src_dir}"; inc_counter immich skipped 1; continue; fi
        find "$src_dir" -type f ! -type l -size "+${IMMICH_THRESHOLD_BYTES}c" \
          ! -name '._*' ! -name '.DS_Store' > "$FILELIST" || true
        while IFS= read -r f; do move_file "$f" "$IMMICH_HDD" "$IMMICH_POD_HDD" "$subdir" "immich"; done < "$FILELIST"
      done
      rm -f "$FILELIST"
      echo "SUMMARY immich moved=$(read_counter immich moved) bytes=$(read_counter immich bytes) failed=$(read_counter immich failed) skipped=$(read_counter immich skipped)"
    else
      echo "=== Jellyfin: scanning movies/, tvshows/, music/ ==="
      for subdir in movies tvshows music; do
        src_dir="${JELLYFIN_SSD}/${subdir}"
        if [ ! -d "$src_dir" ]; then echo "SKIP dir-missing ${src_dir}"; inc_counter jellyfin skipped 1; continue; fi
        find "$src_dir" -type f ! -type l -size "+${JELLYFIN_THRESHOLD_BYTES}c" \
          ! -name '._*' ! -name '.DS_Store' > "$FILELIST" || true
        while IFS= read -r f; do move_file "$f" "$JELLYFIN_HDD" "$JELLYFIN_POD_HDD" "$subdir" "jellyfin"; done < "$FILELIST"
      done
      rm -f "$FILELIST"
      echo "SUMMARY jellyfin moved=$(read_counter jellyfin moved) bytes=$(read_counter jellyfin bytes) failed=$(read_counter jellyfin failed) skipped=$(read_counter jellyfin skipped)"
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tier-mover-immich
  namespace: ${HOMELAB_NAMESPACE}
spec:
  suspend: true
  schedule: "${IMMICH_TIER_SCHEDULE}"
  timeZone: "Europe/London"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: tiered-storage-mover
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
          containers:
            - name: mover
              image: alpine:3.20
              command: ["/bin/sh", "/scripts/mover.sh"]
              env:
                - name: APP
                  value: "immich"
              resources:
                requests: { memory: "256Mi", cpu: "200m" }
                limits:   { memory: "512Mi", cpu: "500m" }
              volumeMounts:
                - name: hdd-check
                  mountPath: /hdd-check
                  readOnly: true
                - name: ssd-immich
                  mountPath: /ssd-immich
                - name: hdd-immich
                  mountPath: /hdd-immich
                - name: script
                  mountPath: /scripts
          volumes:
            - name: hdd-check
              hostPath:
                path: ${HOMELAB_TIER_HDD_PATH}
                type: ""
            - name: ssd-immich
              hostPath:
                # immich-upload-localpath-pvc — PV pvc-17ce78b9-...
                path: /var/lib/rancher/k3s/storage/pvc-17ce78b9-de1e-4fe7-b2f0-214c599795d9_homelab_immich-upload-localpath-pvc
                type: Directory
            - name: hdd-immich
              hostPath:
                path: ${HOMELAB_TIER_HDD_PATH}/immich-library
                type: ""
            - name: script
              configMap:
                name: tiered-storage-mover-script
                defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tier-mover-jellyfin
  namespace: ${HOMELAB_NAMESPACE}
spec:
  suspend: true
  schedule: "${JELLYFIN_TIER_SCHEDULE}"
  timeZone: "Europe/London"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: tiered-storage-mover
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
          containers:
            - name: mover
              image: alpine:3.20
              command: ["/bin/sh", "/scripts/mover.sh"]
              env:
                - name: APP
                  value: "jellyfin"
              resources:
                requests: { memory: "256Mi", cpu: "200m" }
                limits:   { memory: "512Mi", cpu: "500m" }
              volumeMounts:
                - name: hdd-check
                  mountPath: /hdd-check
                  readOnly: true
                - name: ssd-jellyfin
                  mountPath: /ssd-jellyfin
                - name: hdd-jellyfin
                  mountPath: /hdd-jellyfin
                - name: script
                  mountPath: /scripts
          volumes:
            - name: hdd-check
              hostPath:
                path: ${HOMELAB_TIER_HDD_PATH}
                type: ""
            - name: ssd-jellyfin
              hostPath:
                # jellyfin-media-hostpath-pv — live hostPath after local-path→hostPath migration.
                # Confirmed via: kubectl -n homelab get pv jellyfin-media-hostpath-pv -o jsonpath='{.spec.hostPath.path}'
                # type: "" (resilient — no strict existence check, matches hdd-jellyfin convention).
                path: /Users/nila/movies
                type: ""
            - name: hdd-jellyfin
              hostPath:
                path: ${HOMELAB_TIER_HDD_PATH}/jellyfin-media
                type: ""
            - name: script
              configMap:
                name: tiered-storage-mover-script
                defaultMode: 0755
---
# ─────────────────────────────────────────────────────────────────────────────
# immich-backup — restic-based, incremental, decoupled-pod backup (Immich only).
#
# Design (v2 rework):
#   • initContainer  : pg_dump of the immich DB → shared emptyDir /work/immich-db.sql
#   • main container : restic backup of SSD library + HDD-tiered originals + the
#                      pg dump, into a restic repo on the dedicated BACKUP HDD
#                      (${HOMELAB_HDD_PATH}/restic-immich), NOT the tier HDD.
#   • Incremental    : restic dedups + only stores new/changed blobs each run.
#   • Retention      : --keep-weekly 8 --keep-monthly 24 --prune
#
# PRE-FLIGHT MOUNT GUARD: the repo must live on the real backup HDD.  We require
#   a sentinel ${HOMELAB_HDD_PATH}/.homelab-backup-hdd to exist (created on the
#   real disk during deploy).  If missing, we ERROR + exit non-zero WITHOUT
#   running restic — never silently write the repo into the VM's ephemeral disk.
#
# RESTIC_PASSWORD comes from the restic-immich-secret Secret (created out-of-band
# by deploy.sh — NOT templated here, so the password value never lives in git).
#
# Name/namespace/labels preserved — the storage-console "Immich Backup" card
# drives this CronJob by name (suspend toggle + createJobFromCronJob).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
  namespace: ${HOMELAB_NAMESPACE}
spec:
  suspend: true
  schedule: "${IMMICH_BACKUP_SCHEDULE}"
  timeZone: "Europe/London"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: immich-backup
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
          initContainers:
            # ── pg_dump → /work/immich-db.sql (shared emptyDir) ──────────────
            - name: pg-dump
              image: postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  set -o pipefail
                  TS="$(date +%Y-%m-%dT%H:%M:%S%z)"
                  echo "ts=${TS} event=immich.backup.pgdump.start actor=immich-backup target=immich-postgres/immich outcome=begin reason=scheduled-or-manual"
                  OUT=/work/immich-db.sql
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h immich-postgres -U "${POSTGRES_USER}" -d immich \
                    --no-owner --clean --if-exists > "${OUT}"
                  BYTES="$(stat -c%s "${OUT}" 2>/dev/null || echo 0)"
                  echo "ts=$(date +%Y-%m-%dT%H:%M:%S%z) event=immich.backup.pgdump.end actor=immich-backup target=${OUT} outcome=success reason=pg_dump-complete bytes=${BYTES}"
                  if [ "${BYTES}" -lt 1024 ]; then
                    echo "ts=$(date +%Y-%m-%dT%H:%M:%S%z) event=immich.backup.pgdump.guard actor=immich-backup target=${OUT} outcome=fail reason=dump-suspiciously-small bytes=${BYTES}"
                    exit 1
                  fi
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef: { name: immich-postgres-secret, key: POSTGRES_USER }
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: immich-postgres-secret, key: POSTGRES_PASSWORD }
              resources:
                requests: { memory: "256Mi", cpu: "200m" }
                limits:   { memory: "1Gi",   cpu: "1" }
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            # ── restic backup of library + tiered originals + pg dump ────────
            - name: restic
              # alpine pinned base; restic installed via apk (native arm64, has a
              # shell + mountpoint + stat — restic/restic is distroless/no-shell).
              image: alpine:3.21
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  log() { echo "ts=$(date +%Y-%m-%dT%H:%M:%S%z) actor=immich-backup $*"; }
                  log "event=immich.backup.start outcome=begin reason=scheduled-or-manual repo=${RESTIC_REPOSITORY}"

                  # a. PRE-FLIGHT MOUNT GUARD ───────────────────────────────────
                  # The repo must be on the real backup HDD.  Require the sentinel
                  # marker at the backup-disk ROOT (/backup-root mounts
                  # ${HOMELAB_HDD_PATH}); /repo is its restic-immich/ subdir.  If
                  # the marker is absent the HDD is unplugged OR the hostPath
                  # silently fell back to the pod overlay fs — abort WITHOUT
                  # touching restic so we never write the repo to ephemeral disk.
                  if [ ! -f "/backup-root/.homelab-backup-hdd" ]; then
                    log "event=immich.backup.guard target=/backup-root outcome=fail reason=backup-hdd-marker-missing"
                    log "event=immich.backup.end outcome=fail reason=preflight-guard-aborted"
                    exit 1
                  fi
                  log "event=immich.backup.guard target=/backup-root outcome=pass reason=backup-hdd-marker-present"

                  log "event=immich.backup.toolinstall outcome=begin reason=apk-add-restic"
                  apk add --no-cache restic >/dev/null
                  log "event=immich.backup.toolinstall outcome=success reason=$(restic version)"

                  # b. init repo if it does not yet exist ──────────────────────
                  if restic cat config >/dev/null 2>&1; then
                    log "event=immich.backup.repo.open outcome=success reason=existing-repo"
                  else
                    log "event=immich.backup.repo.init outcome=begin reason=repo-not-found"
                    restic init
                    log "event=immich.backup.repo.init outcome=success reason=repo-created"
                  fi

                  # c. stale-lock recovery ─────────────────────────────────────
                  # Remove ALL stale locks left by previously-killed runs.  Each
                  # k8s pod has a unique hostname so plain `restic unlock` only
                  # clears locks owned by THIS hostname — stale locks from other
                  # pods remain and block `restic backup`.  --remove-all is safe
                  # here because the CronJob's concurrencyPolicy=Forbid guarantees
                  # no OTHER live backup is running concurrently.
                  log "event=immich.backup.unlock outcome=begin reason=clear-all-stale-locks"
                  if restic unlock --remove-all; then
                    log "event=immich.backup.unlock outcome=success reason=all-stale-locks-cleared"
                  else
                    log "event=immich.backup.unlock outcome=warn reason=unlock-nonzero-continuing"
                  fi

                  # d. incremental backup ──────────────────────────────────────
                  log "event=immich.backup.snapshot.start outcome=begin reason=backup-ssd+hdd+pgdump paths=/ssd-immich,/hdd-immich,/work"
                  START="$(date +%s)"
                  if restic backup --host immich --tag weekly /ssd-immich /hdd-immich /work; then
                    DUR="$(( $(date +%s) - START ))"
                    log "event=immich.backup.snapshot.end outcome=success reason=backup-complete duration_s=${DUR}"
                  else
                    DUR="$(( $(date +%s) - START ))"
                    log "event=immich.backup.snapshot.end outcome=fail reason=restic-backup-nonzero duration_s=${DUR}"
                    exit 1
                  fi

                  # e. remove stale locks then retention / prune ──────────────
                  # Stale locks can be left if the container is OOMKilled or
                  # restarted mid-run; unlock before forget so it never blocks.
                  log "event=immich.backup.unlock outcome=begin reason=clear-all-stale-locks-before-forget"
                  restic unlock --remove-all || true
                  log "event=immich.backup.unlock outcome=done reason=all-stale-locks-cleared-before-forget"
                  log "event=immich.backup.forget.start outcome=begin reason=keep-weekly-8-monthly-24-prune"
                  if restic forget --keep-weekly 8 --keep-monthly 24 --prune; then
                    log "event=immich.backup.forget.end outcome=success reason=forget-prune-complete"
                  else
                    log "event=immich.backup.forget.end outcome=fail reason=forget-prune-nonzero"
                    exit 1
                  fi

                  # f. report snapshots + stats ────────────────────────────────
                  log "event=immich.backup.snapshots outcome=info reason=listing-below"
                  restic snapshots --compact || true
                  log "event=immich.backup.stats outcome=info reason=stats-latest-below"
                  restic stats latest || true

                  log "event=immich.backup.end outcome=success reason=all-steps-complete"
              env:
                - name: RESTIC_REPOSITORY
                  value: "/repo"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: restic-immich-secret, key: RESTIC_PASSWORD }
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits:   { memory: "2Gi",   cpu: "2" }
              volumeMounts:
                - name: ssd-immich
                  mountPath: /ssd-immich
                  readOnly: true
                - name: hdd-immich
                  mountPath: /hdd-immich
                  readOnly: true
                - name: repo
                  mountPath: /repo
                - name: backup-root
                  mountPath: /backup-root
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            # SSD Immich library (RO) — local-path PV hostPath
            - name: ssd-immich
              hostPath:
                # immich-upload-localpath-pvc — PV pvc-17ce78b9-...
                path: /var/lib/rancher/k3s/storage/pvc-17ce78b9-de1e-4fe7-b2f0-214c599795d9_homelab_immich-upload-localpath-pvc
                type: Directory
            # HDD-tiered Immich originals (RO) — on the TIER HDD
            - name: hdd-immich
              hostPath:
                path: ${HOMELAB_TIER_HDD_PATH}/immich-library
                type: ""
            # restic repo (RW) — on the dedicated BACKUP HDD
            - name: repo
              hostPath:
                path: ${HOMELAB_HDD_PATH}/restic-immich
                type: ""
            # backup-disk ROOT (RO) — holds the .homelab-backup-hdd sentinel
            # the pre-flight mount guard checks before any restic write.
            - name: backup-root
              hostPath:
                path: ${HOMELAB_HDD_PATH}
                type: ""
            # shared scratch for the pg dump (initContainer → main container)
            - name: work
              emptyDir: {}
