<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storage Console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>💾 Storage Console</h1>
    <p>Homelab storage operations — connect your HDD first</p>
  </header>

  <div class="container">

    <!-- Action buttons -->
    <div class="btn-grid">
      <button class="action-btn" data-action="move-images">
        <span class="icon">🖼️</span>
        <span class="label">
          Move bigger images
          <small>Move Immich files &gt;2 GiB from SSD → HDD</small>
        </span>
      </button>

      <button class="action-btn" data-action="move-movies">
        <span class="icon">🎬</span>
        <span class="label">
          Move bigger movies
          <small>Move Jellyfin files &gt;3 GiB from SSD → HDD</small>
        </span>
      </button>

      <button class="action-btn" data-action="backup-immich">
        <span class="icon">💾</span>
        <span class="label">
          Backup Immich
          <small>pg_dump + tarball Immich library → HDD</small>
        </span>
      </button>
    </div>

    <!-- Idle placeholder -->
    <div id="idle-msg">
      <p>No job running. Press a button above to start.</p>
    </div>

    <!-- Job status panel (hidden until a job is running/was running) -->
    <div id="job-panel" class="hidden">
      <div class="job-header">
        <span id="job-name" class="job-name"></span>
        <span id="phase-badge" class="badge badge-pending">Pending</span>
      </div>

      <div id="elapsed" class="elapsed">Elapsed: 0s</div>

      <div id="banner" class="banner hidden"></div>

      <button id="log-toggle" class="log-toggle">Hide logs ▲</button>
      <pre id="log-pre">Waiting for logs…</pre>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
